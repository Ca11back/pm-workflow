name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node -e "const fs = require('node:fs'); const actual = fs.readdirSync('scripts').sort(); const expected = ['sync-runtime.mjs']; if (JSON.stringify(actual) !== JSON.stringify(expected)) { console.error({ actual, expected }); process.exit(1); }"
      - run: node scripts/sync-runtime.mjs --check
      - run: npm run test:coverage
